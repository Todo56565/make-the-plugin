# dsh-token-budget 装载补丁：把本插件行挂到 DSH 宿主层（与 agent-teams 同一层）。
#
# 安装：`dsh plugin --profile <name> add <本包名或本地路径>`。
# 整体启停：DSH 插件管理面板。
# 修改配置：DSH 插件管理面板 → dsh-token-budget → 本行的设置页（模型为下拉选择）。
- insert:
    - id: dsh-token-budget
      # 必须与 package.json 的 name 一致
      name: 'dsh-token-budget'
      config:
        # 必须与 agent-teams 行的 stateDir 一致
        stateDir: .agent-teams
        notes: true
        history: true
        teamHistory: true
        remindAtRatio: 0.37
        compactAtRatio: 0.45
        bucketStep: 0.03
        contextTool: true
        notesMerge: false
        maxFileBytes: 10000
        hintMaxBytes: 4000
        hintRecentNotes: 5
        historyMaxResults: 200
        historyMaxReadChars: 20000
        historyMaxListItems: 2000
